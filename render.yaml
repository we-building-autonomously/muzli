services:
  - type: web
    name: muzli-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    envVars:
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PATH
        value: /data/connections.db
      - key: GIN_MODE
        value: release
    disk:
      name: muzli-data
      mountPath: /data
      sizeGB: 1
